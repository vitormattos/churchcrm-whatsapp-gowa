name: Tests
on:
  push:
  pull_request:
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: find src routes views -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -r 'json_decode(file_get_contents("plugin.json"), true, 512, JSON_THROW_ON_ERROR);'

  browser-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run test:ui
