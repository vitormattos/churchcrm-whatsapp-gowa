name: PHP syntax
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: php-syntax-${{ github.ref }}
  cancel-in-progress: true
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: find src routes views tests/php -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -r 'json_decode(file_get_contents("plugin.json"), true, 512, JSON_THROW_ON_ERROR);'
