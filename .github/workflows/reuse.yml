name: REUSE
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: reuse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  spdx-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
